<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HEIC → Any Format</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --border: #2a2a2e;
      --text: #e4e4e7;
      --text-muted: #71717a;
      --accent: #22d3a8;
      --accent-dim: rgba(34, 211, 168, 0.15);
      --error: #f87171;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    main {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 0.25rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: var(--surface);
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .dropzone input {
      display: none;
    }

    .dropzone-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
      opacity: 0.8;
    }

    .dropzone-text {
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .dropzone-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .options {
      margin-top: 1.5rem;
      display: grid;
      gap: 1rem;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    label {
      font-size: 0.9rem;
      font-weight: 500;
      min-width: 100px;
    }

    select {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.9rem;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    .quality-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .quality-row input[type="range"] {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      accent-color: var(--accent);
    }

    .quality-value {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      min-width: 2.5rem;
    }

    .actions {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--border);
    }

    .result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      display: none;
    }

    .result.visible {
      display: block;
    }

    .result-preview {
      max-width: 100%;
      max-height: 240px;
      border-radius: var(--radius-sm);
      display: block;
      margin: 0 auto 1rem;
      background: var(--bg);
    }

    .result-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .message {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      margin-top: 1rem;
      display: none;
    }

    .message.visible {
      display: block;
    }

    .message.error {
      background: rgba(248, 113, 113, 0.12);
      color: var(--error);
    }

    .message.success {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .file-name {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      word-break: break-all;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>HEIC → Any Format</h1>
    <p class="subtitle">Convert HEIC/HEIF images to JPEG, PNG, or GIF in your browser. No uploads—everything runs locally.</p>

    <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Drop HEIC file or click to choose">
      <input type="file" id="fileInput" accept=".heic,.heif,image/heic,image/heif" />
      <div class="dropzone-icon">📷</div>
      <div class="dropzone-text">Drop HEIC file here or click to browse</div>
      <div class="dropzone-hint">.heic, .heif</div>
    </div>

    <div class="options">
      <div class="option-row">
        <label for="format">Output format</label>
        <select id="format">
          <option value="image/jpeg">JPEG</option>
          <option value="image/png">PNG</option>
          <option value="image/gif">GIF</option>
        </select>
      </div>
      <div class="quality-row" id="qualityRow">
        <label for="quality">Quality</label>
        <input type="range" id="quality" min="0" max="1" step="0.05" value="0.92" />
        <span class="quality-value" id="qualityValue">92%</span>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn-primary" id="convertBtn" disabled>Convert</button>
      <button type="button" class="btn-secondary" id="downloadBtn" disabled style="display: none;">Download</button>
    </div>

    <div class="message" id="message"></div>
    <div class="result" id="result">
      <img class="result-preview" id="resultPreview" alt="Converted preview" />
      <div class="file-name" id="resultFileName"></div>
      <div class="result-actions">
        <button type="button" class="btn-primary" id="downloadFromResult">Download</button>
      </div>
    </div>
  </main>

  <footer>
    Powered by <a href="https://github.com/alexcorvi/heic2any" target="_blank" rel="noopener">heic2any</a>. Conversion runs entirely in your browser.
  </footer>

  <script>
    (function () {
      const dropzone = document.getElementById("dropzone");
      const fileInput = document.getElementById("fileInput");
      const formatSelect = document.getElementById("format");
      const qualityInput = document.getElementById("quality");
      const qualityValue = document.getElementById("qualityValue");
      const qualityRow = document.getElementById("qualityRow");
      const convertBtn = document.getElementById("convertBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const messageEl = document.getElementById("message");
      const resultEl = document.getElementById("result");
      const resultPreview = document.getElementById("resultPreview");
      const resultFileName = document.getElementById("resultFileName");
      const downloadFromResult = document.getElementById("downloadFromResult");

      let currentBlob = null;
      let currentFileName = null;
      let convertedBlob = null;
      let convertedFileName = null;

      function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = "message visible " + (type || "");
      }

      function hideMessage() {
        messageEl.className = "message";
      }

      function updateQualityLabel() {
        const pct = Math.round(Number(qualityInput.value) * 100);
        qualityValue.textContent = pct + "%";
      }

      function toggleQualityVisibility() {
        const isJpeg = formatSelect.value === "image/jpeg";
        qualityRow.style.display = isJpeg ? "flex" : "none";
      }

      formatSelect.addEventListener("change", toggleQualityVisibility);
      qualityInput.addEventListener("input", updateQualityLabel);
      updateQualityLabel();
      toggleQualityVisibility();

      dropzone.addEventListener("click", () => fileInput.click());

      dropzone.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          fileInput.click();
        }
      });

      dropzone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropzone.classList.add("dragover");
      });

      dropzone.addEventListener("dragleave", () => {
        dropzone.classList.remove("dragover");
      });

      dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("dragover");
        const file = e.dataTransfer?.files?.[0];
        if (file) setFile(file);
      });

      fileInput.addEventListener("change", () => {
        const file = fileInput.files?.[0];
        if (file) setFile(file);
      });

      function setFile(file) {
        const name = (file.name || "").toLowerCase();
        if (!name.endsWith(".heic") && !name.endsWith(".heif") && !file.type.includes("heic") && !file.type.includes("heif")) {
          showMessage("Please choose a HEIC or HEIF file.", "error");
          return;
        }
        currentBlob = file;
        currentFileName = file.name.replace(/\.[^.]+$/i, "") || "converted";
        convertedBlob = null;
        hideMessage();
        convertBtn.disabled = false;
        resultEl.classList.remove("visible");
        downloadBtn.style.display = "none";
      }

      function getExtension(mime) {
        if (mime === "image/jpeg") return "jpg";
        if (mime === "image/png") return "png";
        if (mime === "image/gif") return "gif";
        return "bin";
      }

      convertBtn.addEventListener("click", convert);

      async function convert() {
        if (!currentBlob) return;
        convertBtn.disabled = true;
        hideMessage();
        const toType = formatSelect.value;
        const quality = toType === "image/jpeg" ? Number(qualityInput.value) : undefined;

        try {
          const result = await heic2any({
            blob: currentBlob,
            toType: toType,
            quality: quality
          });
          const blob = Array.isArray(result) ? result[0] : result;
          if (!blob) throw new Error("Conversion produced no output.");
          convertedBlob = blob;
          convertedFileName = currentFileName + "." + getExtension(toType);
          resultPreview.src = URL.createObjectURL(blob);
          resultFileName.textContent = convertedFileName;
          resultEl.classList.add("visible");
          downloadBtn.style.display = "inline-block";
          showMessage("Conversion complete.", "success");
        } catch (err) {
          showMessage("Conversion failed: " + (err.message || "Unknown error"), "error");
        } finally {
          convertBtn.disabled = false;
        }
      }

      function doDownload() {
        if (!convertedBlob || !convertedFileName) return;
        const a = document.createElement("a");
        a.href = URL.createObjectURL(convertedBlob);
        a.download = convertedFileName;
        a.click();
        URL.revokeObjectURL(a.href);
      }

      downloadBtn.addEventListener("click", doDownload);
      downloadFromResult.addEventListener("click", doDownload);
    })();
  </script>
</body>
</html>
